<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terminal · Madhup Bhardwaj</title>
<meta name="description" content="A little terminal for exploring Madhup Bhardwaj's portfolio. Type help to start.">
<meta property="og:title" content="terminal · Madhup Bhardwaj">
<meta property="og:description" content="a little terminal for exploring my site. type help.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="madhup.">
<meta property="og:url" content="https://madhupbhardwaj.vercel.app/terminal">
<meta property="og:image" content="https://madhupbhardwaj.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A line drawing of Madhup saying hi, next to his name and the line curiosity, made tangible.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://madhupbhardwaj.vercel.app/og.png">
<link rel="canonical" href="https://madhupbhardwaj.vercel.app/terminal">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Architects+Daughter&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  try {
    var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t;
    if (localStorage.getItem('sound') === 'off') document.documentElement.dataset.sound = 'off';
  } catch (e) {}
</script>
</head>
<body>

<nav class="nav band">
  <div class="col nav-inner">
    <a href="/" class="logo" data-sfx aria-label="home">m.</a>
    <div class="nav-links">
      <a href="/about" data-sfx>about</a>
      <a href="/projects" data-sfx>projects</a>
      <a href="/reading" data-sfx>reading</a>
      <a href="/me" data-sfx>me</a>
      <span class="sep" aria-hidden="true"></span>
      <a href="/terminal" class="icon-btn here-icon" aria-current="page" aria-label="terminal" title="terminal" data-sfx>
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m7 9 3 3-3 3M12.5 15H17"/></svg>
      </a>
      <button id="soundBtn" class="icon-btn" type="button" aria-label="Toggle sound" data-sfx>
        <svg class="on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle dark mode" data-sfx>
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main class="band term-page">
  <div class="col">
    <a class="back mono" href="/" data-sfx>← back home</a>

    <div class="term" id="term">
      <div class="term-bar">
        <span class="lights">
          <button class="light red" type="button" id="termClose" aria-label="close terminal (back home)" title="back home"></button>
          <button class="light yellow" type="button" id="termMin" aria-label="minimise" title="minimise"></button>
          <button class="light green" type="button" id="termMax" aria-label="make the window bigger" title="bigger"></button>
        </span>
        <span class="term-title"><span><span class="t-long">visitor — </span>madhup — zsh — <span id="termSize">80×24</span></span></span>
      </div>
      <div class="term-body" id="termBody" role="log" aria-live="polite">
        <div id="termOut"></div>
        <label class="term-line term-input-line">
          <span class="prompt" aria-hidden="true"><span class="p-user">visitor@madhup</span> <span class="p-path">~</span> %</span>
          <input id="termIn" type="text" aria-label="type a command, then press enter" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
        </label>
      </div>
    </div>

    <p class="term-tip mono">type <b>help</b> and press enter. <span class="t-mouse">tab completes, ↑ ↓ for history.</span></p>
  </div>
</main>

<footer class="band foot">
  <div class="col mono">
    <span>© <span id="year">2026</span> madhup bhardwaj · india</span>
    <button id="soundText" class="ul linkish" type="button" data-sfx>sound on</button>
  </div>
</footer>

<script src="script.js"></script>
<script src="terminal.js"></script>
</body>
</html>
